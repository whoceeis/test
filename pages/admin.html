<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="application-name" content="Kaspi.kz">
  <meta name="apple-mobile-web-app-title" content="Kaspi.kz">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="robots" content="noindex">
  <title>Админ-панель</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages/admin.css">
  <script src="/js/no-zoom.js"></script>
</head>
<body>
  <div class="app app--flat app--no-tabbar admin">
    <section class="admin__login" id="login-view" hidden>
      <h1 class="admin__title">Админ-панель</h1>
      <form class="admin__form" id="login-form" novalidate>
        <label class="visually-hidden" for="password">Пароль администратора</label>
        <input class="field-input" id="password" name="password" type="password"
               autocomplete="current-password" placeholder="Пароль" required>
        <p class="form-error" id="login-error" role="alert" hidden></p>
        <button class="btn btn--primary" id="login-submit" type="submit">Войти</button>
      </form>
    </section>

    <section class="admin__panel" id="panel-view" hidden>
      <header class="admin__header">
        <h1 class="admin__title">Доступ пользователей</h1>
        <button class="admin__link" id="logout" type="button">Выйти</button>
      </header>

      <form class="admin__form" id="create-form" novalidate>
        <label class="admin__label" for="label">Новый пользователь</label>
        <input class="field-input" id="label" name="label" type="text" maxlength="60"
               autocomplete="off" placeholder="Имя, чтобы вы его узнали" required>
        <button class="btn btn--primary" id="create-submit" type="submit">Создать код доступа</button>
      </form>

      <div class="code-box" id="code-box" hidden>
        <p class="code-box__title">Код для «<span id="code-label"></span>»</p>
        <output class="code-box__code" id="code-value"></output>
        <p class="code-box__hint">Код показывается один раз и подходит для одного входа. Передайте его пользователю.</p>
        <button class="btn btn--outline" id="copy-code" type="button">Скопировать код</button>
      </div>

      <p class="form-error" id="panel-error" role="alert" hidden></p>

      <h2 class="admin__subtitle">Пользователи</h2>
      <ul class="users" id="users"></ul>
      <p class="users__empty" id="users-empty" hidden>Пока никого нет. Создайте первый код.</p>
    </section>
  </div>

  <template id="user-template">
    <li class="user">
      <div class="user__row">
        <span class="user__name"></span>
        <span class="user__status"></span>
      </div>
      <p class="user__meta"></p>
      <div class="user__actions">
        <button class="user__btn" type="button" data-action="code">Новый код</button>
        <button class="user__btn" type="button" data-action="revoke">Отозвать доступ</button>
        <button class="user__btn user__btn--danger" type="button" data-action="delete">Удалить</button>
      </div>
    </li>
  </template>

  <script src="/js/admin.js" defer></script>
</body>
</html>
