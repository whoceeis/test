<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="application-name" content="Kaspi.kz">
  <meta name="apple-mobile-web-app-title" content="Kaspi.kz">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <title>Вход</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages/login.css">
  <script src="/js/no-zoom.js"></script>
</head>
<body>
  <div class="app app--flat app--no-tabbar app--center">
    <main class="login">
      <h1 class="login__title">Вход</h1>
      <p class="login__text">Введите одноразовый код доступа. Код нужен только при первом входе на этом устройстве.</p>

      <form class="login__form" id="login-form" novalidate>
        <label class="visually-hidden" for="code">Код доступа</label>
        <input class="field-input login__code" id="code" name="code" type="text" inputmode="text"
               autocomplete="one-time-code" autocapitalize="characters" autocorrect="off" spellcheck="false"
               maxlength="11" placeholder="XXXXX-XXXXX" required>
        <p class="form-error" id="error" role="alert" hidden></p>
        <button class="btn btn--primary" id="submit" type="submit">Войти</button>
      </form>
    </main>
  </div>
  <script src="/js/login.js" defer></script>
</body>
</html>
